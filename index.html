<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hifz Post Generator - Full Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'AL-Kanz';
            src: url('Al-Kanz for Windows.ttf') format('truetype'); 
        }
        @font-face {
            font-family: 'Kanz-al-Marjaan';
            src: url('Kanz-al-Marjaan.ttf') format('truetype'); 
        }
        body { font-family: 'Kanz-al-Marjaan', serif; background: #1a1a2e; color: #ecf0f1; margin: 0; padding: 20px; display: flex; flex-direction: row; gap: 30px; justify-content: center; }
        .editor-panel { background: #ffffff; color: #2c3e50; padding: 25px; border-radius: 15px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 8px solid #d4af37; height: 95vh; overflow-y: auto; }
        h2 { font-family: 'Kanz-al-Marjaan', serif; text-align: center; color: #1a5276; margin-top: 0; }
        .field { margin-bottom: 12px; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px; }
        label { display: block; font-size: 0.8em; font-weight: bold; margin-bottom: 4px; color: #34495e; }
        input[type="text"], select, input[type="file"], input[type="range"], input[type="color"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #bdc3c7; box-sizing: border-box; font-family: 'Amiri'; margin-bottom: 4px; }
        input[type="color"] { height: 40px; cursor: pointer; padding: 2px; }
        .inline-group { display: flex; gap: 10px; }
        .inline-group div { flex: 1; }
        canvas { border: 10px solid #fff; box-shadow: 0 15px 45px rgba(0,0,0,0.4); max-width: 550px; height: auto; background: #2c3e50; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Aref Ruqaa'; font-weight: bold; background: #27ae60; color: white; font-size: 1.1em; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button.clear-btn { background: #c0392b; }
    </style>
</head>
<body>

    <div class="editor-panel">
        <h2>Post Editor</h2>
        
        <div class="field">
            <label>1. Select Marhala</label>
            <select id="templateSelect" onchange="updateBackground()">
                <option value="">--Select Marhala--</option>
                <option value="Balad.png">Surat al Balad</option>
                <option value="Inshiqaq.png">Surat al Inshiqaq</option>
                <option value="M1.png">Marhala 1</option>
                <option value="M2.png">Marhala 2</option>
                <option value="M3.png">Marhala 3</option>
                <option value="M4 ON.png">Marhala 4 (Old Nizam)</option>
                <option value="M4 NN.png">Marhala 4 (New Nizam)</option>
                <option value="M5 ON.png">Marhala 5 (Old Nizam)</option>
                <option value="M5 NN.png">Marhala 5 (New Nizam)</option>
                <option value="M6 ON.png">Marhala 6 (Old Nizam)</option>
                <option value="M6 NN.png">Marhala 6 (New Nizam)</option>
                <option value="M7 ON.png">Marhala 7 (Old Nizam)</option>
                <option value="M7 NN.png">Marhala 7 (New Nizam)</option>
                <option value="IN.png">Ikhtebaar Nihaee</option>
            </select>
        </div>

        <div class="field">
            <label>2. Institute Location (Type or Select)</label>
            <input type="text" id="instName" list="instList" placeholder="Type or select location...">
            <datalist id="instList">
                <option value="قسم التحفيظ - جمالي محلة">جمالي محلة</option>
                <option value="قسم التحفيظ - المحلة البرهانية">المحلة البرهانية</option>
                <option value="قسم التحفيظ - برهاني باغ محلة">برهاني باغ محلة</option
